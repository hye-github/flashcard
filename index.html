<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낱말카드 학습 앱</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-x-180 {
            transform: rotateX(180deg);
        }

        .card-info-container {
            display: flex;
            flex-direction: column;
        }

        body {
            overflow-x: hidden;
        }

        /* 💡 카드 영역만 터치 처리 - 세로 스크롤 차단, 가로 스와이프만 허용 */
        .card-area {
            touch-action: pan-x;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAsYx34KpX5PXCCW2Ol2-XWlQYJfBm976s",
            authDomain: "flashcard-c5a7d.firebaseapp.com",
            projectId: "flashcard-c5a7d",
            storageBucket: "flashcard-c5a7d.firebasestorage.app",
            messagingSenderId: "432209869357",
            appId: "1:432209869357:web:ff6b143534ae643795d6a4",
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Upload = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        );

        const Download = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const Edit2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
        );

        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Shuffle = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="16 3 21 3 21 8"></polyline>
                <line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline>
                <line x1="15" y1="15" x2="21" y2="21"></line>
                <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
        );

        const ArrowLeftRight = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M8 3L4 7l4 4"></path>
                <path d="M4 7h16"></path>
                <path d="M16 21l4-4-4-4"></path>
                <path d="M20 17H4"></path>
            </svg>
        );

        const Star = ({ size = 24, fill = 'none', stroke = 'currentColor' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={stroke} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
        );

        function FlashcardApp() {
            const [categories, setCategories] = useState([]);
            const [cards, setCards] = useState([]);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedMainCategory, setSelectedMainCategory] = useState('all');
            const [selectedSubCategory, setSelectedSubCategory] = useState('all');
            const [currentCardIndex, setCurrentCardIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [displayMode, setDisplayMode] = useState('term-to-def');
            const [previousDisplayMode, setPreviousDisplayMode] = useState('term-to-def');
            const [showFavoritesOnly, setShowFavoritesOnly] = useState(false);
            const [shuffledCards, setShuffledCards] = useState([]);
            const [currentRandomSeed, setCurrentRandomSeed] = useState(0);
            const [showAddCategory, setShowAddCategory] = useState(false);
            const [showAddCard, setShowAddCard] = useState(false);
            const [editingCard, setEditingCard] = useState(null);
            const [selectedCards, setSelectedCards] = useState([]);
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);
            const [newCategory, setNewCategory] = useState({ main: '', sub: '' });
            const [newCard, setNewCard] = useState({ id: null, mainCategory: '', subCategory: '', term: '', definition: '', favorite: false });
            const [user, setUser] = useState(null);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) {
                        setIsAdmin(false);
                    }
                });

                const unsubscribeCards = db.collection('flashcards').onSnapshot(snapshot => {
                    const fetchedCards = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setCards(fetchedCards);
                }, error => {
                    console.error("Firestore에서 카드 로딩 오류:", error);
                    alert("카드를 불러오는 데 실패했습니다. 콘솔을 확인해주세요.");
                });

                const unsubscribeCategories = db.collection('categories').onSnapshot(snapshot => {
                    const fetchedCategories = snapshot.docs.map(doc => ({
                        id: doc.id,
                        main: doc.id,
                        subs: doc.data().subs || []
                    }));
                    setCategories(fetchedCategories);
                }, error => {
                    console.error("Firestore에서 카테고리 로딩 오류:", error);
                    alert("카테고리를 불러오는 데 실패했습니다. 콘솔을 확인해주세요.");
                });

                return () => {
                    unsubscribeCards();
                    unsubscribeCategories();
                    unsubscribeAuth();
                };
            }, []);

            const handleLogin = async () => {
                const email = prompt("관리자 이메일을 입력하세요.");
                const password = prompt("비밀번호를 입력하세요.");
                if (!email || !password) return;

                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    alert("로그인 성공! 관리자 모드로 전환되었습니다.");
                } catch (error) {
                    console.error("로그인 오류:", error);
                    alert("로그인에 실패했습니다: " + error.message);
                }
            };

            const handleLogout = async () => {
                if (confirm("정말 로그아웃 하시겠습니까?")) {
                    await auth.signOut();
                    alert("로그아웃되었습니다.");
                }
            };

            const handleAddCategory = async () => {
                if (!newCategory.main.trim()) return;

                const mainCategoryName = newCategory.main.trim();
                const subCategoryName = newCategory.sub.trim();

                try {
                    const categoryRef = db.collection('categories').doc(mainCategoryName);
                    const doc = await categoryRef.get();

                    if (doc.exists) {
                        if (subCategoryName) {
                            await categoryRef.update({
                                subs: firebase.firestore.FieldValue.arrayUnion(subCategoryName)
                            });
                        }
                    } else {
                        await categoryRef.set({
                            main: mainCategoryName,
                            subs: subCategoryName ? [subCategoryName] : []
                        });
                    }
                    alert('카테고리가 저장되었습니다.');
                } catch (error) {
                    console.error("카테고리 저장 오류:", error);
                    alert("카테고리 저장 중 오류가 발생했습니다.");
                } finally {
                    setNewCategory({ main: '', sub: '' });
                    setShowAddCategory(false);
                }
            };

            const handleDeleteMainCategory = async (mainCategoryName) => {
                if (confirm(`메인 카테고리 "${mainCategoryName}"를 삭제하시겠습니까? (경고: 이 카테고리를 사용하는 카드 데이터는 수동으로 정리해야 합니다.)`)) {
                    try {
                        await db.collection('categories').doc(mainCategoryName).delete();
                        alert(`메인 카테고리 "${mainCategoryName}"가 삭제되었습니다.`);
                    } catch (error) {
                        console.error("메인 카테고리 삭제 오류:", error);
                        alert("메인 카테고리 삭제 중 오류가 발생했습니다.");
                    }
                }
            };

            const handleDeleteSubCategory = async (mainCategoryName, subCategoryName) => {
                if (confirm(`세부 카테고리 "${subCategoryName}"를 삭제하시겠습니까?`)) {
                    try {
                        await db.collection('categories').doc(mainCategoryName).update({
                            subs: firebase.firestore.FieldValue.arrayRemove(subCategoryName)
                        });
                        alert(`세부 카테고리 "${subCategoryName}"가 삭제되었습니다.`);
                    } catch (error) {
                        console.error("세부 카테고리 삭제 오류:", error);
                        alert("세부 카테고리 삭제 중 오류가 발생했습니다.");
                    }
                }
            };

            const toggleFavorite = async (cardId) => {
                const cardRef = db.collection('flashcards').doc(cardId);
                const card = cards.find(c => c.id === cardId);
                if (card) {
                    try {
                        await cardRef.update({ favorite: !card.favorite });
                    } catch (error) {
                        console.error("즐겨찾기 업데이트 오류:", error);
                    }
                }
            };

            const handleSaveCard = async () => {
                if (!newCard.mainCategory || !newCard.term.trim() || !newCard.definition.trim()) {
                    alert("메인 카테고리, 용어, 정의는 필수 입력 항목입니다.");
                    return;
                }

                const cardToSave = {
                    mainCategory: newCard.mainCategory,
                    subCategory: newCard.subCategory || '',
                    term: newCard.term,
                    definition: newCard.definition,
                    favorite: newCard.favorite || false
                };

                try {
                    if (newCard.id) {
                        await db.collection('flashcards').doc(newCard.id).update(cardToSave);
                        alert('카드가 수정되었습니다.');
                    } else {
                        await db.collection('flashcards').add(cardToSave);
                        alert('카드가 추가되었습니다.');
                    }
                } catch (error) {
                    console.error("카드 저장 오류:", error);
                    alert("카드 저장/수정 중 오류가 발생했습니다.");
                } finally {
                    setNewCard({ id: null, mainCategory: '', subCategory: '', term: '', definition: '', favorite: false });
                    setShowAddCard(false);
                    setEditingCard(null);
                }
            };

            const handleDeleteCard = async (cardId) => {
                if (confirm('이 카드를 Firestore에서 영구적으로 삭제하시겠습니까?')) {
                    try {
                        await db.collection('flashcards').doc(cardId).delete();
                        alert('카드가 삭제되었습니다.');
                    } catch (error) {
                        console.error("카드 삭제 오류:", error);
                        alert("카드 삭제 중 오류가 발생했습니다.");
                    }
                }
            };

            const handleDeleteSelectedCards = async () => {
                if (selectedCards.length === 0) {
                    alert('삭제할 카드를 선택해주세요.');
                    return;
                }

                if (confirm(`선택한 ${selectedCards.length}개의 카드를 삭제하시겠습니까?`)) {
                    try {
                        const batch = db.batch();
                        selectedCards.forEach(cardId => {
                            const cardRef = db.collection('flashcards').doc(cardId);
                            batch.delete(cardRef);
                        });
                        await batch.commit();
                        alert(`${selectedCards.length}개의 카드가 삭제되었습니다.`);
                        setSelectedCards([]);
                    } catch (error) {
                        console.error("카드 삭제 오류:", error);
                        alert("카드 삭제 중 오류가 발생했습니다.");
                    }
                }
            };

            const toggleCardSelection = (cardId) => {
                setSelectedCards(prev => 
                    prev.includes(cardId) 
                        ? prev.filter(id => id !== cardId)
                        : [...prev, cardId]
                );
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n').filter(line => line.trim());

                    const newCards = lines.slice(1).map(line => {
                        const values = line.split(',').map(v => v.trim());
                        return {
                            mainCategory: values[0] || '',
                            subCategory: values[1] || '',
                            term: values[2] || '',
                            definition: values[3] || '',
                            favorite: false
                        };
                    }).filter(card => card.term && card.definition && card.mainCategory);

                    if (newCards.length === 0) {
                        alert('유효한 카드가 CSV 파일에 없습니다.');
                        e.target.value = '';
                        return;
                    }

                    const existingTerms = cards.map(c => c.term.toLowerCase());
                    const duplicates = [];
                    const cardsToAdd = newCards.filter(card => {
                        if (existingTerms.includes(card.term.toLowerCase())) {
                            duplicates.push(card.term);
                            return false;
                        }
                        return true;
                    });

                    if (duplicates.length > 0) {
                        alert(`다음 용어는 중복되어 등록되지 않았습니다:\n${duplicates.join(', ')}`);
                    }

                    if (cardsToAdd.length === 0) {
                        alert('등록 가능한 카드가 없습니다.');
                        e.target.value = '';
                        return;
                    }

                    try {
                        const categoryUpdates = {};
                        cardsToAdd.forEach(card => {
                            const main = card.mainCategory;
                            const sub = card.subCategory;

                            if (!categoryUpdates[main]) {
                                categoryUpdates[main] = new Set();
                            }
                            if (sub) {
                                categoryUpdates[main].add(sub);
                            }
                        });

                        for (const mainCategoryName in categoryUpdates) {
                            const categoryRef = db.collection('categories').doc(mainCategoryName);
                            const doc = await categoryRef.get();
                            const subsToAdd = Array.from(categoryUpdates[mainCategoryName]);

                            if (doc.exists) {
                                const existingSubs = doc.data().subs || [];
                                const newSubs = subsToAdd.filter(sub => !existingSubs.includes(sub));
                                
                                if (newSubs.length > 0) {
                                    await categoryRef.update({
                                        subs: firebase.firestore.FieldValue.arrayUnion(...newSubs)
                                    });
                                }
                            } else {
                                await categoryRef.set({
                                    main: mainCategoryName,
                                    subs: subsToAdd
                                });
                            }
                        }

                        const cardBatch = db.batch();
                        cardsToAdd.forEach(card => {
                            const newDocRef = db.collection('flashcards').doc();
                            cardBatch.set(newDocRef, card);
                        });

                        await cardBatch.commit();
                        alert(`${cardsToAdd.length}개의 카드가 성공적으로 등록되었습니다.${duplicates.length > 0 ? `\n(${duplicates.length}개 중복 제외)` : ''}`);
                    } catch (error) {
                        console.error("CSV 업로드 오류:", error);
                        alert("CSV 업로드 중 오류가 발생했습니다: " + error.message);
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            const handleCSVDownload = () => {
                const BOM = '\uFEFF';
                const csv = [
                    'Main Category,Sub Category,Term,Definition,Favorite',
                    ...cards.map(c => `${c.mainCategory},${c.subCategory || ''},${c.term},${c.definition},${c.favorite ? 'Y' : 'N'}`)
                ].join('\n');

                const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'flashcards.csv';
                link.click();
            };

            const filteredCards = cards.filter(card => {
                if (showFavoritesOnly && !card.favorite) return false;
                if (selectedMainCategory !== 'all' && card.mainCategory !== selectedMainCategory) return false;
                if (selectedSubCategory !== 'all' && card.subCategory !== selectedSubCategory) return false;
                return true;
            });

            useEffect(() => {
                const shuffled = [...filteredCards].sort(() => Math.random() - 0.5);
                setShuffledCards(shuffled);
                setCurrentCardIndex(0);
            }, [filteredCards.length, selectedMainCategory, selectedSubCategory, showFavoritesOnly, cards.length]);

            useEffect(() => {
                if (cards.length > 0 && shuffledCards.length === 0) {
                    const shuffled = [...cards].sort(() => Math.random() - 0.5);
                    setShuffledCards(shuffled);
                }
            }, [cards]);

            useEffect(() => {
                if (shuffledCards.length > 0) {
                    const updated = shuffledCards.map(shuffledCard => {
                        const original = cards.find(c => c.id === shuffledCard.id);
                        return original || shuffledCard;
                    });
                    setShuffledCards(updated);
                }
            }, [cards]);

            const getCurrentCard = () => {
                if (shuffledCards.length === 0) return null;
                const card = shuffledCards[currentCardIndex];

                let front, back, frontType, backType;
                const seed = displayMode === 'random' ? currentRandomSeed : 0;

                if (displayMode === 'random') {
                    const showTermFirst = seed > 0.5;
                    front = showTermFirst ? card.term : card.definition;
                    back = showTermFirst ? card.definition : card.term;
                    frontType = showTermFirst ? 'term' : 'definition';
                    backType = showTermFirst ? 'definition' : 'term';
                } else if (displayMode === 'def-to-term') {
                    front = card.definition;
                    back = card.term;
                    frontType = 'definition';
                    backType = 'term';
                } else {
                    front = card.term;
                    back = card.definition;
                    frontType = 'term';
                    backType = 'definition';
                }

                return { front, back, frontType, backType, original: card };
            };

            const currentCard = getCurrentCard();

            const goToNext = () => {
                setIsFlipped(false);
                setCurrentCardIndex((prev) => (prev + 1) % shuffledCards.length);
                setCurrentRandomSeed(Math.random());
            };

            const goToPrev = () => {
                setIsFlipped(false);
                setCurrentCardIndex((prev) => (prev - 1 + shuffledCards.length) % shuffledCards.length);
                setCurrentRandomSeed(Math.random());
            };

            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;

                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;

                if (isLeftSwipe) {
                    goToNext();
                } else if (isRightSwipe) {
                    goToPrev();
                }
            };

            const subCategories = selectedMainCategory === 'all'
                ? []
                : categories.find(c => c.main === selectedMainCategory)?.subs || [];

            if (isAdmin) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h1 className="text-3xl font-bold text-gray-800">관리자 모드</h1>
                                    <button
                                        onClick={() => setIsAdmin(false)}
                                        className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600"
                                    >
                                        학습 모드로 전환
                                    </button>
                                </div>

                                <div className="mb-8">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-semibold">카테고리 관리 ({categories.length}개)</h2>
                                        <button
                                            onClick={() => setShowAddCategory(!showAddCategory)}
                                            className="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
                                        >
                                            <Plus size={20} />
                                            카테고리 추가
                                        </button>
                                    </div>

                                    {showAddCategory && (
                                        <div className="bg-gray-50 p-4 rounded-lg mb-4">
                                            <select
                                                value={newCategory.main}
                                                onChange={(e) => setNewCategory({ ...newCategory, main: e.target.value, sub: '' })}
                                                className="w-full p-2 border rounded mb-2"
                                            >
                                                <option value="">기존 메인 카테고리 선택</option>
                                                {categories.map((cat) => (
                                                    <option key={cat.id} value={cat.main}>{cat.main}</option>
                                                ))}
                                            </select>

                                            <input
                                                type="text"
                                                placeholder="또는 새 메인 카테고리 입력"
                                                value={newCategory.main}
                                                onChange={(e) => setNewCategory({ ...newCategory, main: e.target.value })}
                                                className="w-full p-2 border rounded mb-2"
                                            />

                                            <input
                                                type="text"
                                                placeholder="세부 카테고리 (선택사항 - 기존 카테고리 선택 시 추가됨)"
                                                value={newCategory.sub}
                                                onChange={(e) => setNewCategory({ ...newCategory, sub: e.target.value })}
                                                className="w-full p-2 border rounded mb-2"
                                            />
                                            <button
                                                onClick={handleAddCategory}
                                                className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
                                            >
                                                저장/추가
                                            </button>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {categories.map((cat) => (
                                            <div key={cat.id} className="bg-gray-50 p-4 rounded-lg flex flex-col">
                                                <div className="flex justify-between items-center mb-2">
                                                    <div className="font-bold text-lg">{cat.main}</div>
                                                    <button
                                                        onClick={() => handleDeleteMainCategory(cat.main)}
                                                        className="p-1 text-red-500 hover:bg-red-200 rounded-full"
                                                        title="메인 카테고리 삭제"
                                                    >
                                                        <Trash2 size={16} />
                                                    </button>
                                                </div>
                                                <div className="text-sm text-gray-600 flex flex-wrap gap-2">
                                                    {cat.subs.length > 0 ? cat.subs.map((sub, i) => (
                                                        <div key={i} className="flex items-center bg-white border border-gray-300 rounded-full px-3 py-1 text-xs">
                                                            {sub}
                                                            <button
                                                                onClick={() => handleDeleteSubCategory(cat.main, sub)}
                                                                className="ml-2 text-red-400 hover:text-red-600"
                                                                title="세부 카테고리 삭제"
                                                            >
                                                                &times;
                                                            </button>
                                                        </div>
                                                    )) : <span className="text-gray-400">세부 카테고리 없음</span>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-semibold">카드 관리 ({cards.length}개)</h2>
                                        <div className="flex gap-2 flex-wrap">
                                            <button
                                                onClick={() => {
                                                    if (selectedCards.length === cards.length) {
                                                        setSelectedCards([]);
                                                    } else {
                                                        setSelectedCards(cards.map(c => c.id));
                                                    }
                                                }}
                                                className="flex items-center gap-2 px-4 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500 text-sm"
                                            >
                                                {selectedCards.length === cards.length ? '선택 해제' : '모두 선택'}
                                            </button>
                                            
                                            {selectedCards.length > 0 && (
                                                <button
                                                    onClick={handleDeleteSelectedCards}
                                                    className="flex items-center gap-2 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 text-sm"
                                                >
                                                    <Trash2 size={20} />
                                                    선택 삭제 ({selectedCards.length})
                                                </button>
                                            )}
                                            <label className="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 cursor-pointer text-sm">
                                                <Upload size={20} />
                                                CSV 업로드
                                                <input type="file" accept=".csv" onChange={handleCSVUpload} className="hidden" />
                                            </label>
                                            <button
                                                onClick={handleCSVDownload}
                                                className="flex items-center gap-2 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 text-sm"
                                            >
                                                <Download size={20} />
                                                CSV 다운로드
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setShowAddCard(!showAddCard);
                                                    setEditingCard(null);
                                                    setNewCard({ id: null, mainCategory: '', subCategory: '', term: '', definition: '', favorite: false });
                                                }}
                                                className="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm"
                                            >
                                                <Plus size={20} />
                                                카드 추가
                                            </button>
                                        </div>
                                    </div>

                                    {showAddCard && (
                                        <div className="bg-gray-50 p-4 rounded-lg mb-4">
                                            <select
                                                value={newCard.mainCategory}
                                                onChange={(e) => setNewCard({ ...newCard, mainCategory: e.target.value, subCategory: '' })}
                                                className="w-full p-2 border rounded mb-2"
                                            >
                                                <option value="">메인 카테고리 선택</option>
                                                {categories.map((cat) => (
                                                    <option key={cat.id} value={cat.main}>{cat.main}</option>
                                                ))}
                                            </select>

                                            {newCard.mainCategory && categories.find(c => c.main === newCard.mainCategory)?.subs.length > 0 && (
                                                <select
                                                    value={newCard.subCategory}
                                                    onChange={(e) => setNewCard({ ...newCard, subCategory: e.target.value })}
                                                    className="w-full p-2 border rounded mb-2"
                                                >
                                                    <option value="">세부 카테고리 선택 (선택사항)</option>
                                                    {categories.find(c => c.main === newCard.mainCategory)?.subs.map((sub, i) => (
                                                        <option key={i} value={sub}>{sub}</option>
                                                    ))}
                                                </select>
                                            )}

                                            <input
                                                type="text"
                                                placeholder="용어"
                                                value={newCard.term}
                                                onChange={(e) => setNewCard({ ...newCard, term: e.target.value })}
                                                className="w-full p-2 border rounded mb-2"
                                            />
                                            <textarea
                                                placeholder="정의"
                                                value={newCard.definition}
                                                onChange={(e) => setNewCard({ ...newCard, definition: e.target.value })}
                                                className="w-full p-2 border rounded mb-2 h-24"
                                            />
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={handleSaveCard}
                                                    className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
                                                >
                                                    {newCard.id ? '수정' : '추가'}
                                                </button>
                                                <button
                                                    onClick={() => {
                                                        setShowAddCard(false);
                                                        setEditingCard(null);
                                                        setNewCard({ id: null, mainCategory: '', subCategory: '', term: '', definition: '', favorite: false });
                                                    }}
                                                    className="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
                                                >
                                                    취소
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {cards.map((card) => (
                                            <div key={card.id} className="bg-gray-50 p-4 rounded-lg flex justify-between items-start">
                                                <div className="flex items-start gap-3 flex-1">
                                                    <input
                                                        type="checkbox"
                                                        checked={selectedCards.includes(card.id)}
                                                        onChange={() => toggleCardSelection(card.id)}
                                                        className="mt-1 w-4 h-4"
                                                    />
                                                    <div className="flex-1">
                                                        <div className="text-xs text-gray-500 mb-1">
                                                            {card.mainCategory} {card.subCategory && `> ${card.subCategory}`}
                                                        </div>
                                                        <div className="font-semibold">{card.term}</div>
                                                        <div className="text-sm text-gray-600 mt-1">{card.definition}</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => {
                                                            setEditingCard(card.id);
                                                            setNewCard({ ...card, id: card.id });
                                                            setShowAddCard(true);
                                                        }}
                                                        className="p-2 text-blue-500 hover:bg-blue-100 rounded"
                                                    >
                                                        <Edit2 size={18} />
                                                    </button>
                                                    <button
                                                        onClick={() => handleDeleteCard(card.id)}
                                                        className="p-2 text-red-500 hover:bg-red-100 rounded"
                                                    >
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-100 p-2">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-2 mb-2">
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-2xl font-bold text-gray-800">낱말카드 학습</h1>

                                {user ? (
                                    <div className="flex items-center gap-2">
                                        <span className="text-sm text-gray-600 hidden sm:inline">{user.email}님</span>
                                        <button
                                            onClick={handleLogout}
                                            className="px-3 py-1 bg-red-500 text-white rounded-lg hover:bg-red-600 text-sm"
                                        >
                                            로그아웃
                                        </button>
                                        <button
                                            onClick={() => setIsAdmin(true)}
                                            className="px-3 py-1 bg-gray-500 text-white rounded-lg hover:bg-gray-600 text-sm"
                                        >
                                            관리자 모드
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={handleLogin}
                                        className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 text-sm"
                                    >
                                        관리자 로그인
                                    </button>
                                )}
                            </div>

                            <div className="space-y-3 mb-3">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <select
                                        value={selectedMainCategory}
                                        onChange={(e) => {
                                            setSelectedMainCategory(e.target.value);
                                            setSelectedSubCategory('all');
                                            setCurrentCardIndex(0);
                                        }}
                                        className="p-2 border rounded-lg"
                                    >
                                        <option value="all">모든 카테고리</option>
                                        {categories.map((cat) => (
                                            <option key={cat.id} value={cat.main}>{cat.main}</option>
                                        ))}
                                    </select>

                                    {selectedMainCategory !== 'all' && (
                                        <select
                                            value={selectedSubCategory}
                                            onChange={(e) => {
                                                setSelectedSubCategory(e.target.value);
                                                setCurrentCardIndex(0);
                                            }}
                                            className="p-2 border rounded-lg"
                                        >
                                            <option value="all">모든 세부 카테고리</option>
                                            {subCategories.map((sub, i) => (
                                                <option key={i} value={sub}>{sub}</option>
                                            ))}
                                        </select>
                                    )}
                                </div>

                                <div className="flex gap-2">
                                    <button
                                        onClick={() => {
                                            setShowFavoritesOnly(!showFavoritesOnly);
                                            setCurrentCardIndex(0);
                                        }}
                                        className={`flex-1 p-2 border rounded-lg flex items-center justify-center gap-2 ${showFavoritesOnly ? 'bg-yellow-100 border-yellow-400' : 'bg-white'
                                            }`}
                                    >
                                        <Star size={18} fill={showFavoritesOnly ? '#fbbf24' : 'none'} />
                                        <span className="text-sm">즐겨찾기</span>
                                    </button>

                                    <button
                                        onClick={() => {
                                            if (displayMode === 'random') {
                                                const newMode = previousDisplayMode === 'term-to-def' ? 'def-to-term' : 'term-to-def';
                                                setPreviousDisplayMode(newMode);
                                            } else {
                                                const newMode = displayMode === 'term-to-def' ? 'def-to-term' : 'term-to-def';
                                                setDisplayMode(newMode);
                                                setPreviousDisplayMode(newMode);
                                            }
                                            setIsFlipped(false);
                                        }}
                                        className={`p-2 rounded-lg ${displayMode === 'def-to-term' || (displayMode === 'random' && previousDisplayMode === 'def-to-term')
                                                ? 'bg-blue-200'
                                                : 'bg-gray-200 hover:bg-gray-300'
                                            }`}
                                        title={displayMode === 'def-to-term' ? '정의 → 용어' : '용어 → 정의'}
                                    >
                                        <ArrowLeftRight size={18} />
                                    </button>

                                    <button
                                        onClick={() => {
                                            if (displayMode === 'random') {
                                                setDisplayMode(previousDisplayMode);
                                            } else {
                                                setPreviousDisplayMode(displayMode);
                                                setDisplayMode('random');
                                                setCurrentRandomSeed(Math.random());
                                            }
                                            setIsFlipped(false);
                                        }}
                                        className={`p-2 rounded-lg ${displayMode === 'random' ? 'bg-purple-200' : 'bg-gray-200 hover:bg-gray-300'
                                            }`}
                                        title="랜덤"
                                    >
                                        <Shuffle size={18} />
                                    </button>
                                </div>
                            </div>

                            {currentCard ? (
                                <div className="mb-2">
                                    <div className="text-center text-gray-600 mb-2 order-1">
                                        <div className="text-sm font-semibold text-gray-700">
                                            {currentCard.original.mainCategory}
                                            {currentCard.original.subCategory && ` > ${currentCard.original.subCategory}`}
                                        </div>
                                    </div>

                                    <div
                                        className="relative w-full h-80 cursor-pointer perspective-1000 card-area"
                                        onClick={() => setIsFlipped(!isFlipped)}
                                        onTouchStart={onTouchStart}
                                        onTouchMove={onTouchMove}
                                        onTouchEnd={onTouchEnd}
                                    >
                                        <div
                                            className={`absolute w-full h-full transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-x-180' : ''
                                                }`}
                                        >
                                            <div className="absolute w-full h-full backface-hidden bg-white rounded-xl shadow-lg p-8 flex flex-col">
                                                <div className="text-xs text-gray-400 mb-2">
                                                    {currentCard.frontType === 'term' ? '용어' : '정의'}
                                                </div>
                                                <div className="flex-1 flex items-center justify-center">
                                                    <div
                                                        className={`break-words text-center font-bold ${
                                                            currentCard.frontType === 'term' ? 'text-3xl' : 'text-xl'
                                                        } text-gray-800`}
                                                    >
                                                        {currentCard.front}
                                                    </div>
                                                </div>
                                                <div className="text-sm text-gray-400 text-center">클릭하여 뒤집기</div>
                                            </div>

                                            <div className="absolute w-full h-full backface-hidden bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl shadow-lg p-8 flex flex-col rotate-x-180">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="text-xs text-white/70">
                                                        {currentCard.backType === 'term' ? '용어' : '정의'}
                                                    </div>
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            toggleFavorite(currentCard.original.id);
                                                        }}
                                                        className="p-2 hover:bg-white/20 rounded-lg transition-colors -mt-2 -mr-2"
                                                    >
                                                        <Star
                                                            size={24}
                                                            fill={currentCard.original.favorite ? '#fbbf24' : 'none'}
                                                            stroke="white"
                                                        />
                                                    </button>
                                                </div>
                                                <div className="flex-1 flex items-center justify-center">
                                                    <div
                                                        className={`break-words text-center font-bold ${
                                                            currentCard.backType === 'term' ? 'text-3xl' : 'text-xl'
                                                        } text-white`}
                                                    >
                                                        {currentCard.back}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center mt-6">
                                        <button
                                            onClick={goToPrev}
                                            disabled={shuffledCards.length <= 1}
                                            className="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed"
                                        >
                                            이전
                                        </button>

                                        <div className="text-sm text-gray-600 text-center flex-1">
                                            {currentCardIndex + 1} / {shuffledCards.length}
                                        </div>

                                        <button
                                            onClick={goToNext}
                                            disabled={shuffledCards.length <= 1}
                                            className="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed"
                                        >
                                            다음
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-white rounded-lg shadow-lg p-12 text-center">
                                    <div className="text-gray-400 text-xl">
                                        카드가 없습니다. 관리자 모드에서 카드를 추가해주세요.
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<FlashcardApp />);
    </script>
</body>

</html>
